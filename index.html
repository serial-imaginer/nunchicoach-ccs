<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>눈치코치 상담 편의점</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: float 2s ease-in-out infinite;
    }
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in {
      animation: fadeInSlide 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-black">
  <div class="min-h-screen bg-black overflow-y-auto flex flex-col items-center py-[1.5cm] px-4">
    
    <!-- Mobile Phone Frame: Centered, tall, with black background and yellow border -->
    <div class="relative w-full max-w-md mx-auto bg-black border-4 border-yellow-400 
                rounded-[3rem] flex flex-col p-6 shadow-2xl shadow-yellow-800/50 flex-shrink-0">
      
      <!-- Main Content Area within phone frame -->
      <div class="flex flex-col items-center w-full">
        
        <!-- Header -->
        <header class="w-[85%] mx-auto text-center mt-3 mb-8 overflow-hidden">
          <h1 class="text-xl sm:text-3xl font-extrabold text-yellow-400 
                     drop-shadow-[0_0_10px_rgba(250,204,21,0.8)] mb-2 whitespace-nowrap">
            눈치코치 상담 편의점
          </h1>
          <p class="text-[10px] sm:text-[15px] text-blue-400 whitespace-nowrap">
            당신의 고민과 궁금증, 24시간 자판기로 해결!
          </p>
          <div class="w-full h-1 bg-yellow-400 mt-6"></div>
        </header>

        <!-- Navigation Menu (Vending Machine Buttons) -->
        <nav class="w-[85%] mx-auto space-y-4">
          
          <!-- 운세 자판기 -->
          <div class="relative w-full">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 bg-red-500 rounded-full w-12 h-12 flex items-center justify-center animate-pulse z-10 border border-black">
              <span class="text-white text-sm font-bold">무료</span>
            </div>
            <button
              onclick="window.location.href='https://fortune.nunchicoach.com'"
              class="w-full py-5 pl-16 text-white text-xl font-bold rounded-3xl shadow-lg 
                     transition-all duration-300 ease-out 
                     bg-purple-600 hover:bg-purple-500 border-b-4 border-purple-800 active:translate-y-1 active:border
